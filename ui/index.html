<!doctype html>
<html lang="en" data-ui-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Otherstates UI docs</title>
    <meta name="description" content="Otherstates UI docs: React components built on React Aria and StyleX, with live examples of every state, templates, a theme builder, and a kit that installs them into Vite and Next.js apps." />
    <meta property="og:title" content="Otherstates UI docs" />
    <meta property="og:description" content="Every component with live examples of its other states, templates, a theme builder and the kit." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://otherstates.com/ui/" />
    <meta property="og:image" content="https://otherstates.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://otherstates.com/ui/" />
    <link rel="icon" href="/favicon.svg" />
    <!-- Layer order: the reset, then the docs shell, then StyleX. Component styles always win over the docs' own. -->
    <style>@layer reset, docs, priority1, priority2, priority3, priority4, priority5, priority6;</style>
    <!-- Choose the theme before the first paint: a saved choice, or else the system setting.
         The app applies the theme's tokens when it starts; until then a dark page waits on the
         system's own dark canvas instead of flashing white. main.tsx reads the same key. -->
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('otherstates-ui-theme'); } catch (error) { /* Storage is blocked. */ }
        if (theme !== 'dark' && theme !== 'light') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.uiTheme = theme;
      })();
    </script>
    <style>html[data-ui-theme="dark"]:not([data-ui-ready]) { color-scheme: dark; background-color: Canvas; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/ui/catalog/main.tsx"></script>
  </body>
</html>
