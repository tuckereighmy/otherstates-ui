<!doctype html>
<html lang="en" data-ui-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Otherstates UI — every state, already designed</title>
    <meta name="description" content="React components for products with agents in them, for Next.js and Vite. Loading, empty, failed and waiting-on-you states come built in, and a check helps keep your coding agent on the system." />
    <meta property="og:title" content="Otherstates UI — every state, already designed" />
    <meta property="og:description" content="React components built on React Aria and StyleX, with the states products usually forget." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://otherstates.com/" />
    <meta property="og:image" content="https://otherstates.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://otherstates.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Layer order: the reset, then the page's own styles, then StyleX. Component styles always win. -->
    <style>@layer reset, docs, priority1, priority2, priority3, priority4, priority5, priority6;</style>
    <!-- The same theme choice as the docs (/ui/): a saved choice, or else the system setting. -->
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('otherstates-ui-theme'); } catch (error) { /* Storage is blocked. */ }
        if (theme !== 'dark' && theme !== 'light') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.uiTheme = theme;
      })();
    </script>
    <style>html[data-ui-theme="dark"]:not([data-ui-ready]) { color-scheme: dark; background-color: Canvas; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/catalog/home/main.tsx"></script>
  </body>
</html>
